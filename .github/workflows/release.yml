name: Build Windows Release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set release version
        shell: python
        run: |
          import os, re
          from pathlib import Path
          p = Path('update_support.py')
          version = os.environ['GITHUB_REF_NAME'].removeprefix('v') if os.environ['GITHUB_REF_TYPE'] == 'tag' else re.search(r"VERSION='([^']+)'", p.read_text()).group(1)
          if not re.fullmatch(r'\d+\.\d+', version): raise ValueError('Use version tags such as v1.1 or v1.2')
          p.write_text(re.sub(r"VERSION='[^']+'", "VERSION='" + version + "'", p.read_text()))
          Path('build-version.txt').write_text(version)
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.16.0
      - name: Build app and updater
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --contents-directory . --name Arazman --icon icons/arazman-app.ico --add-data "icons;icons" --add-data "fonts;fonts" --add-data "update_config.json;." price_monitor.py
          python -m PyInstaller --noconfirm --clean --windowed --onefile --name "Arazman Updater" --icon icons/arazman-app.ico arazman_updater.py
          Copy-Item "dist/Arazman Updater.exe" "dist/Arazman/"
      - name: Build installer
        shell: pwsh
        run: |
          $version = Get-Content build-version.txt
          & "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe" "/DAppVersion=$version" installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash output/Arazman-Setup.exe -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$PWD/output/Arazman-Setup.exe.sha256", "$hash  Arazman-Setup.exe", [Text.Encoding]::ASCII)
      - uses: actions/upload-artifact@v4
        with:
          name: Arazman-Windows
          path: output/*
      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" output/Arazman-Setup.exe output/Arazman-Setup.exe.sha256 --title "Arazman ${{ github.ref_name }}" --generate-notes
